name: validate

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Validate repository
        run: python -B scripts/validate_repo.py
      - name: Run tests
        run: python -B -m unittest discover -s tests -v
      - name: Verify core.autocrlf checkout offline
        run: python -B tests/platform_verify.py --autocrlf true
